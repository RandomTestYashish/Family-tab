<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="exact.css">
</head>
<body>
  <div class="device">
    <div class="screen">

      <!-- Status-Bar 1.0/App -->
      <div class="status-bar">
        <img class="sb-time" src="assets/f01/time.svg" width="28.4262" height="11.0889" alt="9:41">
        <img class="sb-cell" src="assets/f01/cellular.svg" width="17" height="10.667" alt="">
        <img class="sb-wifi" src="assets/f01/wifi.svg" width="15.333" height="10.9999" alt="">
        <img class="sb-batt" src="assets/f01/battery.svg" width="24.328" height="11.3333" alt="">
      </div>

      <main class="scroll">
        <div class="frame-01">

          <!-- Top Nav Component ✅ -->
          <header class="top-nav">
            <button class="nav-btn" aria-label="Menu"><img src="assets/f01/menu.svg" width="17.2" height="11.4222" alt=""></button>
            <div class="nav-title">
              <h1>My Family</h1>
              <p>3 members • 1 Alert</p>
            </div>
            <button class="nav-btn" aria-label="More"><img src="assets/f01/more.png" width="30" height="30" alt=""></button>
          </header>

          <!-- My Family Airtel App Mockup 1 -->
          <div class="mock mock-1"><img src="assets/f01/mockup-1.png" alt="Family members: You, Add Member, Add Connection"></div>
          <!-- Airtel My Family Dashboard Mockup 2 -->
          <div class="mock mock-2"><img src="assets/f01/mockup-2.png" alt="One family. More together. Add family member"></div>
          <!-- My Family Safety Dashboard Mockup 2 -->
          <div class="mock mock-3"><img src="assets/f01/mockup-3.png" alt="Your family is protected, Family benefits, Personalized Report"></div>

        </div>
      </main>
    </div>
  </div>
</body>
</html>
